<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectorlab | Planetary Analog Mapper — NASA Space Apps Challenge</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        space: { 950: '#030712', 900: '#0b1120', 800: '#111827', 700: '#1f2937' },
                        neon: { cyan: '#06b6d4', blue: '#3b82f6', mars: '#f97316' }
                    }
                }
            }
        };
    </script>

    <!-- Leaflet.js CSS & JS via CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Embedded Space Theme & API-Free Dark Map Styles -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #111a2e 0%, #0b0f19 45%, #050811 100%);
            color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 10px 36px -4px rgba(0, 0, 0, 0.6), 0 0 18px -2px rgba(6, 182, 212, 0.2);
        }
        #map {
            width: 100%; height: 100%; min-height: 450px;
            border-radius: 1rem; background-color: #030712;
            border: 1px solid rgba(6, 182, 212, 0.35);
            box-shadow: 0 0 28px rgba(6, 182, 212, 0.15), inset 0 0 24px rgba(6, 182, 212, 0.1);
        }

        /* OSM UZAY KOYU TEMASI */
        .leaflet-tile {
            filter: brightness(0.55) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important;
        }

        .leaflet-control-zoom a {
            background-color: rgba(11, 15, 25, 0.9) !important;
            color: #06b6d4 !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important;
        }
        .leaflet-control-zoom a:hover { background-color: rgba(6, 182, 212, 0.2) !important; color: #fff !important; }
        .leaflet-control-attribution { background: rgba(5, 8, 17, 0.8) !important; color: #64748b !important; font-size: 9px !important; }
        .leaflet-control-attribution a { color: #94a3b8 !important; }
        
        /* Custom Glowing Pulsing Markers */
        .custom-analog-marker { background: transparent; border: none; }
        .marker-pin-wrapper {
            position: relative; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .marker-core {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #06b6d4; border: 2px solid #fff;
            box-shadow: 0 0 12px #06b6d4, 0 0 24px rgba(6, 182, 212, 0.5);
            z-index: 2; transition: transform 0.25s ease;
        }
        .marker-pulse-ring {
            position: absolute; width: 28px; height: 28px; border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, rgba(6, 182, 212, 0) 70%);
            border: 1.5px solid #06b6d4; animation: telemetry-pulse 2.4s infinite cubic-bezier(0.2, 0.8, 0.4, 1);
            z-index: 1;
        }
        .marker-mars .marker-core { background-color: #f97316; box-shadow: 0 0 12px #f97316, 0 0 24px rgba(249, 115, 22, 0.5); }
        .marker-mars .marker-pulse-ring { background: radial-gradient(circle, rgba(249, 115, 22, 0.4) 0%, rgba(249, 115, 22, 0) 70%); border-color: #f97316; }
        
        .marker-pin-wrapper:hover .marker-core, .marker-pin-wrapper.active .marker-core {
            transform: scale(1.35); background-color: #fff; box-shadow: 0 0 20px #fff, 0 0 35px #06b6d4;
        }
        @keyframes telemetry-pulse {
            0% { transform: scale(0.55); opacity: 0.95; }
            70% { transform: scale(2.1); opacity: 0.15; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        #info-panel::-webkit-scrollbar { width: 5px; }
        #info-panel::-webkit-scrollbar-track { background: rgba(5, 8, 17, 0.6); }
        #info-panel::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.4); border-radius: 9999px; }
        .composition-bar-track { width: 100%; height: 6px; background: rgba(15, 23, 42, 0.9); border-radius: 9999px; overflow: hidden; }
        .composition-bar-fill { height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- TOP NAVIGATION BAR -->
    <header class="h-16 bg-space-900/90 backdrop-blur-md border-b border-slate-800 px-6 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                <i data-lucide="orbit" class="w-6 h-6 text-cyan-400"></i>
            </div>
            <div>
                <div class="flex items-center gap-2.5">
                    <h1 class="text-lg font-bold tracking-wider uppercase text-white">Vectorlab</h1>
                    <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">v1.0</span>
                </div>
                <p class="text-xs text-slate-400 font-mono">Planetary Analog Mapper</p>
            </div>
        </div>

        <!-- Filter Tabs -->
        <nav class="flex items-center gap-1 bg-space-950/90 p-1 rounded-lg border border-slate-800">
            <button id="filter-all" type="button" class="filter-btn active px-3 py-1.5 rounded-md text-xs font-mono font-medium bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition cursor-pointer">ALL ANALOGS (5)</button>
            <button id="filter-mars" type="button" class="filter-btn px-3 py-1.5 rounded-md text-xs font-mono font-medium text-slate-400 hover:text-slate-200 transition cursor-pointer">MARS TARGETS (3)</button>
            <button id="filter-moon" type="button" class="filter-btn px-3 py-1.5 rounded-md text-xs font-mono font-medium text-slate-400 hover:text-slate-200 transition cursor-pointer">LUNAR TARGETS (2)</button>
        </nav>

        <div class="hidden sm:flex items-center gap-4">
            <div class="flex items-center gap-2.5 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-xs font-mono font-medium text-emerald-400 tracking-wider uppercase">System Online</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden relative">
        <!-- MAP SECTION -->
        <section class="lg:col-span-8 xl:col-span-8 relative h-full w-full bg-space-950 p-3 flex flex-col">
            <div class="absolute top-6 left-6 z-[500] pointer-events-none">
                <div class="bg-space-900/90 backdrop-blur-md border border-slate-800 px-3.5 py-2 rounded-lg shadow-lg pointer-events-auto flex items-center gap-3">
                    <i data-lucide="globe-2" class="w-4 h-4 text-cyan-400"></i>
                    <div class="text-xs font-mono">
                        <span class="text-slate-400">COORDS:</span> <span id="hud-coords" class="text-cyan-400">20.0000° N, 00.0000° E</span>
                    </div>
                </div>
            </div>
            <div class="absolute bottom-6 left-6 z-[500]">
                <button id="btn-reset-map" type="button" class="bg-space-900/90 hover:bg-space-800 border border-slate-700 text-slate-200 px-3.5 py-2 rounded-lg text-xs font-mono flex items-center gap-2 shadow-lg transition cursor-pointer">
                    <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-cyan-400"></i>
                    <span>RESET ORBITAL VIEW</span>
                </button>
            </div>
            <div id="map" class="w-full flex-1 h-full z-10"></div>
        </section>

        <!-- INFO PANEL -->
        <aside id="info-panel" class="lg:col-span-4 xl:col-span-4 h-full bg-space-900/95 backdrop-blur-xl border-l border-slate-800 flex flex-col overflow-y-auto z-20">
            <div id="panel-header" class="p-6 border-b border-slate-800 shrink-0">
                <div class="flex items-center justify-between mb-2">
                    <span id="site-target-badge" class="text-[11px] font-mono uppercase tracking-widest px-2.5 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">Orbital Standby</span>
                    <span id="site-id-code" class="text-xs font-mono text-slate-400">ID: VL-SYS</span>
                </div>
                <h2 id="site-title" class="text-xl font-bold text-white">Planetary Analog Telemetry</h2>
                <p id="site-location-subtitle" class="text-xs font-mono text-slate-400 mt-1 flex items-center gap-1.5">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-cyan-400"></i>
                    <span id="site-coordinates-text">Click a glowing marker on the map to inspect telemetry</span>
                </p>
            </div>
            <div id="panel-content" class="p-6 space-y-5 flex-1"></div>
            <footer class="p-4 border-t border-slate-800 bg-space-950/50 flex items-center justify-between text-[11px] font-mono text-slate-500 shrink-0">
                <span>NASA SPACE APPS // VECTORLAB</span>
                <span id="telemetry-timestamp">UTC: --:--:--</span>
            </footer>
        </aside>
    </main>

    <!-- APPLICATION LOGIC WITH EXPORT MISSION BRIEF FEATURE -->
    <script>
        const analogLocations = [
            {
                id: "VL-001",
                name: "McMurdo Dry Valleys, Antarctica",
                targetBody: "Mars",
                targetSubtitle: "Mars Polar & Permafrost Analog",
                coordinates: [-77.64, 162.52],
                summary: "Rare ice-free zones in continental Antarctica resembling Martian conditions due to extreme cold, hyper-aridity, katabatic winds, and cryospheric permafrost dynamics.",
                geologicalSimilarity: "Ice-cemented permafrost grounds, dry glacial valleys, polygonally patterned ground formations, and hyper-saline subglacial brines closely analogous to Martian northern plains.",
                environmentalConditions: "Mean annual temperatures of -20°C (dropping below -50°C in winter), near-zero liquid precipitation (<50 mm/year), and intense katabatic winds up to 320 km/h.",
                spaceAgencyUtility: "Evaluating structural material degradation and thermal fatigue in cryogenic regimes; validating subsurface ice-drilling payloads (TRIDENT/ExoMars drills).",
                telemetry: { tempEarth: "-20°C to -50°C", tempTarget: "Mars Mean: -63°C", soilSimilarity: "94.2%", soilType: "Cryogenic Silicate Permafrost" },
                soilComposition: [
                    { mineral: "Silicate Regolith (SiO₂)", percentage: 56 },
                    { mineral: "Subsurface Ground Ice (H₂O)", percentage: 24 },
                    { mineral: "Iron Oxides (Fe₂O₃)", percentage: 12 },
                    { mineral: "Salts & Perchlorates", percentage: 8 }
                ]
            },
            {
                id: "VL-002",
                name: "Atacama Desert, Chile",
                targetBody: "Mars",
                targetSubtitle: "Mars Regolith & Hyper-Aridity Analog",
                coordinates: [-23.86, -69.13],
                summary: "One of the closest terrestrial analogs to the Martian surface, characterized by extreme desiccation, intense solar UV radiation, and oxidized perchlorate-rich desert soils.",
                geologicalSimilarity: "Hyper-arid sulfate and chloride salt crusts, oxidized iron-rich regolith, and perchlorate-bearing horizons directly mirroring soils analyzed by Curiosity and Perseverance.",
                environmentalConditions: "Virtually non-existent rainfall (<1–3 mm/year), extreme diurnal thermal swings (-5°C to +40°C), and high surface UV radiation flux (~45 W/m²).",
                spaceAgencyUtility: "Field-testing mechanical durability and navigation of life-detection rovers; calibrating Raman and LIBS spectrometers on organic-poor regolith.",
                telemetry: { tempEarth: "+18°C Mean", tempTarget: "Mars Equatorial: +20°C Max", soilSimilarity: "96.8%", soilType: "Oxidized Sulfate/Perchlorate" },
                soilComposition: [
                    { mineral: "Silica & Plagioclase (SiO₂)", percentage: 52 },
                    { mineral: "Ferric Oxides (Fe₂O₃)", percentage: 21 },
                    { mineral: "Gypsum & Sulfates (CaSO₄)", percentage: 18 },
                    { mineral: "Nitrates & Perchlorates (ClO₄⁻)", percentage: 9 }
                ]
            },
            {
                id: "VL-003",
                name: "Iceland Volcanic Fields & Lava Tubes",
                targetBody: "Moon & Mars",
                targetSubtitle: "Lunar Mare Basalt & Martian Lava Tube Analog",
                coordinates: [64.96, -19.02],
                summary: "An exceptional high-latitude volcanic testbed featuring unaltered basaltic plains, tephra fields, and extensive subsurface lava tubes ideal for simulating Lunar and Martian exploration.",
                geologicalSimilarity: "Tholeiitic flood basalts, glass-rich volcanic tephra, rugged aa/pahoehoe lava flows, and glaciovolcanic subsurface lava tubes containing perennial ice formations.",
                environmentalConditions: "Sub-polar volcanic climate with mean temperatures between -3°C and +10°C, frequent freeze-thaw cycles, and high-velocity katabatic winds.",
                spaceAgencyUtility: "Deploying Ground-Penetrating Radar (GPR) to map subsurface ice deposits (mirroring Lunar polar volatile prospecting); validating cave-exploring robotics.",
                telemetry: { tempEarth: "+2°C Mean", tempTarget: "Subsurface Tube: Stable -2°C", soilSimilarity: "93.5%", soilType: "Tholeiitic Basalt & Tephra" },
                soilComposition: [
                    { mineral: "Basaltic Glass & SiO₂", percentage: 48 },
                    { mineral: "Ferrous Oxide & Magnetite (FeO)", percentage: 19 },
                    { mineral: "Aluminum & Calcium Oxides", percentage: 22 },
                    { mineral: "Magnesium Olivine (MgO)", percentage: 11 }
                ]
            },
            {
                id: "VL-004",
                name: "Rio Tinto, Spain",
                targetBody: "Mars",
                targetSubtitle: "Mars Ancient Water & Mineralogical Analog",
                coordinates: [37.69, -6.58],
                summary: "A striking astrobiological analog featuring deep-red, highly acidic river systems and iron-sulfate precipitates that mirror ancient aqueous and hydrothermal environments on Mars.",
                geologicalSimilarity: "Massive volcanogenic sulfide deposits, ferric-iron precipitates, jarosite, goethite, and hematite mineral assemblages directly equivalent to Meridiani Planum.",
                environmentalConditions: "Extreme geochemical acidity (mean pH 1.5 to 2.5), high concentrations of dissolved heavy metals, and warm Mediterranean seasonal evaporation cycles.",
                spaceAgencyUtility: "Investigating chemolithoautotrophic extremophile microbial ecosystems in harsh iron-sulfur environments to refine biosignature preservation models.",
                telemetry: { tempEarth: "+19°C Mean", tempTarget: "Noachian Mars: Wet/Acidic", soilSimilarity: "95.1%", soilType: "Jarosite & Hematite Precipitate" },
                soilComposition: [
                    { mineral: "Hematite & Goethite (Fe₂O₃)", percentage: 38 },
                    { mineral: "Jarosite & Iron Sulfates", percentage: 31 },
                    { mineral: "Silicate Host Matrix (SiO₂)", percentage: 21 },
                    { mineral: "Pyrite & Chalcopyrite Sulfides", percentage: 10 }
                ]
            },
            {
                id: "VL-005",
                name: "Devon Island / Haughton Crater, Canadian Arctic",
                targetBody: "Moon & Mars",
                targetSubtitle: "Lunar & Martian Impact Crater Analog",
                coordinates: [75.37, -89.80],
                summary: "The largest uninhabited island on Earth, featuring a cold, arid polar desert centered on the 23-km Haughton impact structure, serving as a dual analog for the Moon and Mars.",
                geologicalSimilarity: "Well-preserved complex impact crater morphology, shocked gneiss and carbonate impact breccia, allochthonous melt rocks, and periglacial patterned ground.",
                environmentalConditions: "High-Arctic polar desert regime with mean annual temperatures of -16°C (winter lows of -50°C), low annual precipitation (<180 mm), and continuous daylight.",
                spaceAgencyUtility: "Simulating end-to-end planetary base deployment, long-range delay-tolerant communications, pressurized rover traverses, and EVA spacesuit ergonomics.",
                telemetry: { tempEarth: "-16°C Mean", tempTarget: "Lunar South Pole / Mars High-Lat", soilSimilarity: "95.9%", soilType: "Shocked Impact Breccia & Regolith" },
                soilComposition: [
                    { mineral: "Shocked Carbonate & Dolomite", percentage: 42 },
                    { mineral: "Silicate Impact Melt Breccia", percentage: 34 },
                    { mineral: "Subsurface Permafrost Ice", percentage: 16 },
                    { mineral: "Metallic & Gneissic Clasts", percentage: 8 }
                ]
            }
        ];

        const appState = {
            map: null,
            markerLayerGroup: null,
            markersById: new Map(),
            selectedLocationId: null,
            activeFilter: 'ALL'
        };

        const dom = {};
        function cacheDomElements() {
            dom.mapContainer = document.getElementById('map');
            dom.infoPanel = document.getElementById('info-panel');
            dom.panelContent = document.getElementById('panel-content');
            dom.siteTargetBadge = document.getElementById('site-target-badge');
            dom.siteIdCode = document.getElementById('site-id-code');
            dom.siteTitle = document.getElementById('site-title');
            dom.siteCoordinatesText = document.getElementById('site-coordinates-text');
            dom.hudCoords = document.getElementById('hud-coords');
            dom.btnResetMap = document.getElementById('btn-reset-map');
            dom.filterAll = document.getElementById('filter-all');
            dom.filterMars = document.getElementById('filter-mars');
            dom.filterMoon = document.getElementById('filter-moon');
            dom.telemetryTimestamp = document.getElementById('telemetry-timestamp');
        }

        function initMap() {
            appState.map = L.map('map', {
                center: [20.0, 0.0],
                zoom: 2,
                minZoom: 2,
                maxZoom: 17,
                zoomControl: false,
                worldCopyJump: true
            });
            L.control.zoom({ position: 'bottomright' }).addTo(appState.map);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors | Vectorlab NASA Space Apps',
                maxZoom: 19
            }).addTo(appState.map);

            appState.markerLayerGroup = L.layerGroup().addTo(appState.map);
            setTimeout(() => appState.map.invalidateSize(), 150);

            appState.map.on('mousemove', (e) => {
                if (dom.hudCoords) {
                    dom.hudCoords.textContent = formatCoordinates([e.latlng.lat, e.latlng.lng]);
                }
            });
        }

        function getFilteredLocations(filter) {
            return analogLocations.filter(loc => {
                const target = loc.targetBody.trim();
                if (filter === 'MARS') {
                    return target === 'Mars';
                }
                if (filter === 'MOON') {
                    return target.includes('Moon');
                }
                return true;
            });
        }

        function createCustomMarkerIcon(location, isActive) {
            const isMarsOnly = location.targetBody.trim() === 'Mars';
            return L.divIcon({
                className: 'custom-analog-marker',
                html: `
                    <div class="marker-pin-wrapper ${isMarsOnly ? 'marker-mars' : ''} ${isActive ? 'active' : ''}">
                        <div class="marker-pulse-ring"></div>
                        <div class="marker-core"></div>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
        }

        function renderMarkers(filter) {
            if (!appState.markerLayerGroup) return;
            appState.markerLayerGroup.clearLayers();
            appState.markersById.clear();

            getFilteredLocations(filter).forEach(location => {
                const isSelected = appState.selectedLocationId === location.id;
                const icon = createCustomMarkerIcon(location, isSelected);
                const marker = L.marker(location.coordinates, { icon });

                marker.bindTooltip(
                    `<div class="font-mono text-xs"><span class="text-cyan-400 font-semibold">${location.id}</span> // ${location.name}</div>`,
                    { direction: 'top', offset: [0, -14], opacity: 0.95 }
                );

                marker.on('click', () => selectLocation(location.id));
                marker.addTo(appState.markerLayerGroup);
                appState.markersById.set(location.id, { marker, location });
            });
        }

        function selectLocation(locationId) {
            const loc = analogLocations.find(l => l.id === locationId);
            if (!loc) return;
            appState.selectedLocationId = locationId;

            appState.markersById.forEach(({ marker, location }, id) => {
                marker.setIcon(createCustomMarkerIcon(location, id === locationId));
            });

            if (appState.map) {
                appState.map.flyTo(loc.coordinates, 5, { animate: true, duration: 1.4 });
            }
            if (dom.hudCoords) dom.hudCoords.textContent = formatCoordinates(loc.coordinates);
            renderLocationDetails(loc);
        }

        function renderWelcomeState() {
            appState.selectedLocationId = null;
            const visible = getFilteredLocations(appState.activeFilter);

            if (dom.siteTargetBadge) {
                dom.siteTargetBadge.textContent = appState.activeFilter === 'ALL' ? 'Orbital Standby' : `Filter: ${appState.activeFilter}`;
            }
            if (dom.siteIdCode) dom.siteIdCode.textContent = `SITES: ${visible.length}`;
            if (dom.siteTitle) dom.siteTitle.textContent = 'Planetary Analog Telemetry';
            if (dom.siteCoordinatesText) dom.siteCoordinatesText.textContent = 'Click any marker or select a site below';

            if (!dom.panelContent) return;

            const cardsHtml = visible.map(loc => `
                <button type="button" data-id="${loc.id}" class="w-full text-left glass-card p-3.5 flex items-center justify-between group cursor-pointer">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-mono ${loc.targetBody === 'Mars' ? 'text-orange-400' : 'text-cyan-400'} font-semibold">${loc.id}</span>
                            <span class="text-xs font-semibold text-slate-100 group-hover:text-cyan-300 transition">${loc.name}</span>
                        </div>
                        <span class="text-[11px] font-mono text-slate-400 block mt-1">Target: ${loc.targetBody}</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-cyan-400 transition"></i>
                </button>
            `).join('');

            dom.panelContent.innerHTML = `
                <div class="glass-card p-4 space-y-2">
                    <div class="flex items-center gap-2 text-cyan-400">
                        <i data-lucide="satellite" class="w-4 h-4"></i>
                        <h3 class="text-xs font-mono uppercase tracking-wider font-semibold">Mission Briefing</h3>
                    </div>
                    <p class="text-sm text-slate-300 leading-relaxed">
                        Vectorlab maps terrestrial extreme environments acting as geological and climatic analogs for Moon bases and Mars missions.
                    </p>
                </div>
                <div class="space-y-2">
                    <h3 class="text-xs font-mono uppercase tracking-wider text-slate-400">Verified Analog Locations (${visible.length})</h3>
                    <div class="space-y-2">${cardsHtml}</div>
                </div>
            `;

            dom.panelContent.querySelectorAll('[data-id]').forEach(btn => {
                btn.addEventListener('click', () => selectLocation(btn.getAttribute('data-id')));
            });
            lucide.createIcons();
        }

        function renderLocationDetails(loc) {
            if (!dom.panelContent) return;
            const isMarsOnly = loc.targetBody.trim() === 'Mars';

            if (dom.siteTargetBadge) {
                dom.siteTargetBadge.className = `text-[11px] font-mono uppercase tracking-widest px-2.5 py-0.5 rounded border ${isMarsOnly ? 'bg-orange-500/15 text-orange-400 border-orange-500/40' : 'bg-cyan-500/15 text-cyan-300 border-cyan-500/40'}`;
                dom.siteTargetBadge.textContent = `Target: ${loc.targetBody}`;
            }
            if (dom.siteIdCode) dom.siteIdCode.textContent = `ID: ${loc.id}`;
            if (dom.siteTitle) dom.siteTitle.textContent = loc.name;
            if (dom.siteCoordinatesText) dom.siteCoordinatesText.textContent = formatCoordinates(loc.coordinates);

            const bars = loc.soilComposition.map(item => `
                <div class="space-y-1">
                    <div class="flex justify-between text-xs font-mono">
                        <span class="text-slate-300">${item.mineral}</span>
                        <span class="text-cyan-400 font-semibold">${item.percentage}%</span>
                    </div>
                    <div class="composition-bar-track"><div class="composition-bar-fill" style="width: ${item.percentage}%"></div></div>
                </div>
            `).join('');

            dom.panelContent.innerHTML = `
                <button id="back-btn" type="button" class="text-xs font-mono text-cyan-400 hover:text-cyan-300 flex items-center gap-1.5 cursor-pointer">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> <span>BACK TO ALL SITES</span>
                </button>
                <article class="glass-card p-4 space-y-2">
                    <h3 class="text-xs font-mono uppercase tracking-wider text-cyan-400 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Site Summary</h3>
                    <p class="text-sm text-slate-200 leading-relaxed">${loc.summary}</p>
                </article>
                <article class="glass-card p-4 space-y-3">
                    <h3 class="text-xs font-mono uppercase tracking-wider text-cyan-400 flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4"></i> Geological Similarity & Regolith</h3>
                    <p class="text-sm text-slate-300 leading-relaxed">${loc.geologicalSimilarity}</p>
                    <div class="pt-2 border-t border-slate-800 space-y-2"><span class="text-[11px] font-mono text-slate-400 block">Mineral Breakdown</span>${bars}</div>
                </article>
                <article class="glass-card p-4 space-y-2">
                    <h3 class="text-xs font-mono uppercase tracking-wider text-cyan-400 flex items-center gap-2"><i data-lucide="thermometer-snowflake" class="w-4 h-4"></i> Environmental Conditions</h3>
                    <p class="text-sm text-slate-200 leading-relaxed">${loc.environmentalConditions}</p>
                </article>
                <article class="glass-card p-4 space-y-2">
                    <h3 class="text-xs font-mono uppercase tracking-wider text-cyan-400 flex items-center gap-2"><i data-lucide="rocket" class="w-4 h-4"></i> Space Agency Utility</h3>
                    <p class="text-sm text-slate-200 leading-relaxed">${loc.spaceAgencyUtility}</p>
                </article>
                
                <!-- NEW: EXPORT MISSION BRIEF BUTTON (JSON DOWNLOAD) -->
                <button id="btn-export-json" type="button" class="w-full bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 text-cyan-300 py-3 rounded-lg text-xs font-mono font-semibold flex items-center justify-center gap-2 cursor-pointer transition shadow-[0_0_15px_rgba(6,182,212,0.15)]">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>EXPORT MISSION BRIEF (JSON)</span>
                </button>
            `;

            // Back button event listener
            document.getElementById('back-btn').addEventListener('click', () => {
                renderWelcomeState();
                renderMarkers(appState.activeFilter);
            });

            // Export JSON button event listener
            document.getElementById('btn-export-json').addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(loc, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `Vectorlab_Mission_Brief_${loc.id}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            if (dom.infoPanel) dom.infoPanel.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        function formatCoordinates([lat, lng]) {
            return `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
        }

        function setupFilters() {
            const setFilter = (type, btn) => {
                appState.activeFilter = type;
                [dom.filterAll, dom.filterMars, dom.filterMoon].forEach(b => {
                    b.classList.remove('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/30');
                    b.classList.add('text-slate-400');
                });
                btn.classList.remove('text-slate-400');
                btn.classList.add('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/30');
                renderMarkers(type);
                appState.map.flyTo([20.0, 0.0], 2, { duration: 1.2 });
                renderWelcomeState();
            };

            dom.filterAll.addEventListener('click', () => setFilter('ALL', dom.filterAll));
            dom.filterMars.addEventListener('click', () => setFilter('MARS', dom.filterMars));
            dom.filterMoon.addEventListener('click', () => setFilter('MOON', dom.filterMoon));

            dom.btnResetMap.addEventListener('click', () => {
                appState.map.flyTo([20.0, 0.0], 2, { duration: 1.2 });
                renderWelcomeState();
                renderMarkers(appState.activeFilter);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            cacheDomElements();
            initMap();
            renderMarkers('ALL');
            renderWelcomeState();
            setupFilters();
            setInterval(() => {
                if (dom.telemetryTimestamp) dom.telemetryTimestamp.textContent = `UTC: ${new Date().toISOString().slice(11, 19)}`;
            }, 1000);
            lucide.createIcons();
        });
    </script>
</body>
</html>
